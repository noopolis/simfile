name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  commit-message:
    name: Commit messages and author allowlist
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out pull request head with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check every pull request commit before install
        run: node .github/scripts/ci/commit-message.mts --range "origin/$GITHUB_BASE_REF..HEAD"
      - name: Test commit policy
        run: |
          mkdir -p .tmp-commit-check
          TMPDIR="$PWD/.tmp-commit-check" node --test .github/scripts/ci/commit-message.test.mts

  typecheck-and-audit:
    name: typecheck + dependency audit
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck

  # Split by what the suite actually covers, not by arbitrary file shards.
  # `src/dynamics` builds npm packages inside hermetic sandboxes: 16% of the
  # tests but ~55% of the CPU, so it gets its own job. A red job then names the
  # area that broke, which "test (3)" never could.
  world-and-runtime:
    name: world + runtime tests
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run every suite except the dynamics sandbox builds
        run: >-
          node dist/scripts/run-tests.js
          $(find src web/src scripts -name '*.test.ts' -not -path 'src/dynamics/*' | sort)

  dynamics-sandbox-builds:
    name: dynamics sandbox builds
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build and load dynamics packages in hermetic sandboxes
        run: >-
          node dist/scripts/run-tests.js
          $(find src/dynamics -name '*.test.ts' | sort)
